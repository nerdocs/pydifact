name: "Test"

on: [push, pull_request]
jobs:
  python-versions:
    # Supported Python versions come from the classifiers in pyproject.toml.
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.read.outputs.versions }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: echo "versions=$(python3 scripts/python_versions.py --json)" >> "$GITHUB_OUTPUT"
  pytest:
    needs: python-versions
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ${{ fromJSON(needs.python-versions.outputs.versions) }}
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Test with Pytest
        run: |
          uv run --python ${{ matrix.python-version }} pytest
